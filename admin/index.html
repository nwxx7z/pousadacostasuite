<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Pousada Costa Suítes</title>
<style>
:root{--deep:#052b3d;--ocean:#0e6f8c;--gold:#f2b135;--sand:#f6efe2;--ink:#12303d;--muted:#607783;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7f8;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:22px}header{background:var(--deep);color:#fff;padding:18px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800}.logout{background:#ffffff18;color:#fff;border:1px solid #ffffff33;border-radius:10px;padding:9px 13px}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 14px 45px #052b3d18}.login h1{margin-top:0}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field input,.field select{padding:12px;border:1px solid #ccd8dc;border-radius:10px;background:#fff}.primary{background:var(--ocean);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}.danger{background:#fff1f0;color:var(--danger);border:1px solid #f0c2bd;border-radius:9px;padding:8px 10px}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.tab{border:0;background:#e4ecef;padding:11px 16px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--deep);color:#fff}.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #052b3d12;margin-bottom:18px}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.room{border:1px solid #dbe4e7;border-radius:14px;padding:14px}.room b{display:block;margin-bottom:6px}.calendar-head{display:flex;align-items:center;justify-content:space-between}.calendar-head button{border:0;background:#eef3f4;border-radius:9px;padding:9px 12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:5px}.day{min-height:54px;border:1px solid #e0e7e9;background:#fff;border-radius:9px;padding:6px;text-align:left}.day.blocked{background:#ffe4e1;border-color:#f0aaa2;color:#8b2018}.day.today{outline:2px solid var(--gold)}.day small{display:block;font-size:10px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #e0e7e9;border-radius:11px;padding:11px}.item small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.msg{padding:10px;border-radius:9px;background:#eef8fa;margin:10px 0}.error{background:#fff1f0;color:var(--danger)}@media(max-width:650px){.grid2{grid-template-columns:1fr}.wrap{padding:14px}.day{min-height:48px;padding:4px}.panel{padding:15px}}
</style></head><body><header><div class="wrap head"><div class="brand">🌊 Pousada Costa Suítes · Painel</div><button class="logout" id="logout" hidden>Sair</button></div></header><main class="wrap">
<section id="login" class="login"><h1>Acesso administrativo</h1><p>Gerencie preços e disponibilidade dos quartos.</p><div class="field"><label>Senha</label><input id="password" type="password"></div><button class="primary" id="loginBtn">Entrar</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><div class="tabs"><button class="tab active" data-tab="overview">Resumo</button><button class="tab" data-tab="prices">Preços</button><button class="tab" data-tab="availability">Disponibilidade</button></div>
<div id="overview" class="view"><div class="panel"><h2>Quartos</h2><div id="rooms" class="rooms"></div></div></div>
<div id="prices" class="view hidden"><div class="panel"><h2>Adicionar preço por período</h2><div class="grid2"><div class="field"><label>Quarto</label><select id="priceRoom"></select></div><div class="field"><label id="priceValueLabel">Valor casal (R$)</label><input id="priceValue" type="number" min="0" step=".01"></div><div class="field" id="triplePriceField"><label>Valor triplo (R$) <small style="color:#607783">opcional</small></label><input id="priceTriple" type="number" min="0" step=".01" placeholder="Ex.: 243,00"></div><div class="field"><label>Data inicial</label><input id="priceStart" type="date"></div><div class="field"><label>Data final</label><input id="priceEnd" type="date"></div></div><button class="primary" id="addPrice">Salvar preço</button><div id="priceMsg"></div></div><div class="panel"><h2>Preços cadastrados</h2><div id="priceList" class="list"></div></div></div>
<div id="availability" class="view hidden"><div class="panel"><h2>Bloquear período</h2><div class="grid2"><div class="field"><label>Quarto</label><select id="blockRoom"></select></div><div class="field"><label>Motivo</label><input id="blockReason" placeholder="Reserva, manutenção..."></div><div class="field"><label>Entrada</label><input id="blockStart" type="date"></div><div class="field"><label>Saída</label><input id="blockEnd" type="date"></div></div><button class="primary" id="addBlock">Bloquear período</button><div id="blockMsg"></div></div><div class="panel"><div class="calendar-head"><button id="prev">‹</button><h2 id="monthTitle"></h2><button id="next">›</button></div><div class="field"><label>Visualizar quarto</label><select id="calendarRoom"></select></div><div id="calendar" class="calendar"></div><div style="font-size:12px;color:#607783;margin-top:10px">🔴 indisponível · borda dourada = hoje</div></div><div class="panel"><h2>Bloqueios cadastrados</h2><div id="blockList" class="list"></div></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let password=sessionStorage.getItem('pcs_admin')||'',data={rooms:[],prices:[],blocks:[]},month=new Date();const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');
async function api(action,payload={}){let r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':password},body:JSON.stringify({action,...payload})});let j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}
async function load(){let r=await fetch('/api/admin');if(!r.ok)throw Error('Banco ainda não configurado ou inacessível');data=await r.json();render();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').hidden=false}
function render(){const opts=data.rooms.map(r=>'<option value="'+r.id+'">Quarto '+r.number+'</option>').join('');['priceRoom','blockRoom','calendarRoom'].forEach(id=>$(id).innerHTML=opts);updatePriceFields();$('rooms').innerHTML=data.rooms.map(r=>{let ps=data.prices.filter(p=>p.room_id===r.id),bs=data.blocks.filter(b=>b.room_id===r.id);return '<div class="room"><b>Quarto '+r.number+'</b>'+r.name+'<br><small>'+ps.length+' preço(s) · '+bs.length+' bloqueio(s)</small></div>'}).join('');renderPrices();renderBlocks();renderCalendar()}
function renderPrices(){$('priceList').innerHTML=data.prices.length?data.prices.map(p=>'<div class="item"><div><b>Quarto '+data.rooms.find(r=>r.id===p.room_id).number+' · Casal/principal: R$ '+Number(p.price).toFixed(2).replace('.',',')+(p.price_triple!=null?' · Triplo: R$ '+Number(p.price_triple).toFixed(2).replace('.',','):'')+'</b><br><small>'+fmt(p.start_date)+' → '+fmt(p.end_date)+'</small></div><button class="danger" onclick="delPrice('+p.id+')">Excluir</button></div>').join(''):'Nenhum preço cadastrado.'}
function renderBlocks(){$('blockList').innerHTML=data.blocks.length?data.blocks.map(b=>'<div class="item"><div><b>Quarto '+data.rooms.find(r=>r.id===b.room_id).number+'</b><br><small>'+fmt(b.start_date)+' → '+fmt(b.end_date)+(b.reason?' · '+b.reason:'')+'</small></div><button class="danger" onclick="delBlock('+b.id+')">Liberar</button></div>').join(''):'Nenhum bloqueio cadastrado.'}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),rid=Number($('calendarRoom').value||1);$('monthTitle').textContent=new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),html=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=days;d++){let key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),blocked=data.blocks.some(b=>b.room_id===rid&&key>=b.start_date&&key<=b.end_date),today=new Date().toISOString().slice(0,10);html+='<button class="day '+(blocked?'blocked ':'')+(key===today?'today':'')+'" onclick="pickDay(\''+key+'\')">'+d+(blocked?'<small>Indisponível</small>':'')+'</button>'}$('calendar').innerHTML=html}
function pickDay(d){$('blockStart').value=d;$('blockEnd').value=d}
window.delPrice=async id=>{if(confirm('Excluir este preço?')){await api('delete_price',{id});await load()}};window.delBlock=async id=>{if(confirm('Liberar este período?')){await api('delete_block',{id});await load()}};
$('loginBtn').onclick=async()=>{password=$('password').value;try{await load();sessionStorage.setItem('pcs_admin',password)}catch(e){$('loginMsg').innerHTML='<div class="msg error">'+e.message+'</div>'}};
$('logout').onclick=()=>{sessionStorage.removeItem('pcs_admin');location.reload()};
function updatePriceFields(){const room=data.rooms.find(r=>r.id===Number($('priceRoom').value));const n=room?Number(room.number):0;const allowsTriple=[5,7].includes(n);$('priceValueLabel').textContent=n===4?'Valor quádruplo (R$)':'Valor casal (R$)';$('triplePriceField').classList.toggle('hidden',!allowsTriple);if(!allowsTriple)$('priceTriple').value='';}
$('priceRoom').onchange=updatePriceFields;
$('addPrice').onclick=async()=>{try{await api('add_price',{room_id:Number($('priceRoom').value),price:Number($('priceValue').value),price_triple:[5,7].includes(Number(data.rooms.find(r=>r.id===Number($('priceRoom').value))?.number))&&$('priceTriple').value!==''?Number($('priceTriple').value):null,start_date:$('priceStart').value,end_date:$('priceEnd').value});$('priceMsg').innerHTML='<div class="msg">Preço salvo.</div>';await load()}catch(e){$('priceMsg').innerHTML='<div class="msg error">'+e.message+'</div>'}};
$('addBlock').onclick=async()=>{try{await api('add_block',{room_id:Number($('blockRoom').value),reason:$('blockReason').value,start_date:$('blockStart').value,end_date:$('blockEnd').value});$('blockMsg').innerHTML='<div class="msg">Período bloqueado.</div>';await load()}catch(e){$('blockMsg').innerHTML='<div class="msg error">'+e.message+'</div>'}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar()};$('calendarRoom').onchange=renderCalendar;if(password)load().catch(()=>sessionStorage.removeItem('pcs_admin'));
</script></body></html>
